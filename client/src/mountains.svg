<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#98BCAE" />
      <stop offset="45%" stop-color="#CBBEAD" />
      <stop offset="100%" stop-color="#F7F0E7" />
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#sky)" />

  <!-- far ridge -->
  <polygon points="0,320 100,250 220,300 340,230 480,290 620,240 760,300 800,280 800,600 0,600"
    fill="#6F9988" opacity="0.55" />

  <!-- mid ridge -->
  <polygon points="0,380 140,300 260,360 400,280 560,350 700,300 800,340 800,600 0,600"
    fill="#4F7568" opacity="0.7" />

  <!-- near ridge -->
  <polygon points="0,460 120,390 260,440 420,370 600,440 760,390 800,410 800,600 0,600"
    fill="#35534A" />

  <!-- mist bands -->
  <ellipse cx="180" cy="330" rx="260" ry="34" fill="#F7F0E7" opacity="0.45" filter="url(#soften)" />
  <ellipse cx="560" cy="300" rx="300" ry="30" fill="#F7F0E7" opacity="0.4" filter="url(#soften)" />
  <ellipse cx="400" cy="420" rx="420" ry="40" fill="#F7F0E7" opacity="0.35" filter="url(#soften)" />
</svg>
